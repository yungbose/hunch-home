# Hunch Home as a Home Assistant app. Its image is built from the Dockerfile at the top of the repository and
# holds the app, its page and the released model. The published copy of this file names that image (`image:`),
# which the Supervisor pulls.
name: Hunch Home
version: "0.2.0"
slug: hunch_home
description: Understands home commands in your own words, on this machine. Add it to your assistant with one button.
url: https://github.com/yungbose/hunch-home
arch:
  - aarch64
  - amd64
# The published image, one name for both processors; the Supervisor pulls the tag that matches `version`.
image: ghcr.io/yungbose/hunch-home
homeassistant: "2026.11.0"
init: false
# Offers its Wyoming conversation agent to Home Assistant, which shows it under "Discovered".
discovery:
  - wyoming
# Reads the home, switches devices through Assist's own intent call (with its exposure check) and sets up an
# assistant: Home Assistant's API with the Supervisor's token, as an administrator.
homeassistant_api: true
# The owner's page, inside Home Assistant and behind its sign-in. Never published on the network.
ingress: true
panel_icon: mdi:home-sound-in
panel_title: Hunch Home
# For listening with no wake word (experimental, off by default): the microphone chosen under Audio becomes the
# app's default input. hassio_api (the default role, which reads the Supervisor's /info pages) is only for the
# microphone's description on the page: /audio/info is refused without it (seen in the test machine, 20 Nov 2026).
audio: true
hassio_api: true
# The speech model listening fetches on first use (about 660 MB) is left out of backups; switching listening on
# after a restore fetches it again.
backup_exclude:
  - "speech"
  - "speech/*"
  - "speech/*/*"
# The Wyoming port (10500) is deliberately not listed under ports: it has no sign-in, so it is never published
# on your network. Home Assistant reaches it on the Supervisor's internal network.
# The Supervisor's watchdog (when the owner turns it on) goes by the image's own health check.
